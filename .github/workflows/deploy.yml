name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest

      - name: Build & push Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/admin:latest
          build-args:
            NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://erp.example.sa/api' }}

      - name: Build & push E-Menu image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/emenu/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/emenu:latest
          build-args:
            NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://erp.example.sa/api' }}
            NEXT_PUBLIC_BASE_PATH: /menu
            NEXT_PUBLIC_ASSET_PREFIX: /menu-assets

  deploy:
    name: Deploy to cloud VPS
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOMAIN,PUBLIC_API_URL
          script_stop: true
          script: |
            set -e
            cd /opt/talaltechno
            docker compose --env-file .env.cloud -f docker-compose.cloud.yml build api admin emenu
            docker compose --env-file .env.cloud -f docker-compose.cloud.yml up -d api admin emenu caddy
            docker compose --env-file .env.cloud -f docker-compose.cloud.yml ps
            sleep 45
            curl -fsS --retry 10 --retry-delay 10 --retry-connrefused "https://${DOMAIN}/health"
