# Render Blueprint — نشر "طلال تكنو" مجانياً (Free tier).
# الاستخدام: Render Dashboard → New → Blueprint → اختر هذا الملف (أو زر Deploy to Render).
#
# ⚠️ قيود الخطة المجانية (مهم):
# - خدمات الويب المجانية "تنام" بعد 15 دقيقة من عدم الاستخدام (إقلاع بارد ~1 دقيقة).
# - قاعدة بيانات Render المجانية تُحذف بعد 30 يوماً (مع بياناتها) — لذلك نستخدم
#   Neon (مجانية، بدون بطاقة، بدون انتهاء) كقاعدة بيانات خارجية.
# - 500 دقيقة بناء/شهر (كافية لثلاث خدمات).
#
# للاستخدام "الحقيقي" (24/7 بدون نوم وبدون حذف بيانات) راجع docs/CLOUD.md §14
# (خطط مدفوعة ~27$/شهر) أو docs/RENDER-QUICKSTART.md.
#
# متغير DATABASE_URL (sync: false) سيُطلب عند الإنشاء — الصقه من Neon (انظر §4).

services:
  # ---------------------------------------------------------------------------
  # API (NestJS + Prisma)
  # ---------------------------------------------------------------------------
  - type: web
    name: talaltechno-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # الصق هنا connection string من Neon (postgresql://...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # CORS: النطاقات المسموح لها بالاتصال بالـ API (admin + e-menu).
      - key: APP_URL
        value: https://talaltechno-admin.onrender.com,https://talaltechno-emenu.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_PEPPER
        generateValue: true
      - key: RUN_DB_PUSH
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: PAYMENTS_MODE
        value: mock
      - key: DELIVERY_MODE
        value: mock
      - key: PRINTER_MODE
        value: mock
      - key: ZATCA_ENVIRONMENT
        value: sandbox
      # --- تهيئة أول منشأة تلقائياً (مرة واحدة فقط، idempotent) ---
      - key: BOOTSTRAP_TENANT
        value: "true"
      # لاستعادة كلمة مرور المالك (إذا نسيتها): اجعلها true، أدخل OWNER_PASSWORD
      # الجديد، أعد النشر، ثم أعد false.
      - key: RESET_OWNER_PASSWORD
        value: "false"
      - key: TENANT_NAME
        sync: false
      - key: TENANT_SLUG
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: TENANT_BRANCH
        value: الفرع الرئيسي
      - key: TENANT_CITY
        value: الرياض

  # ---------------------------------------------------------------------------
  # لوحة التحكم (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: talaltechno-admin
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: apps/admin/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://talaltechno-api.onrender.com
      - key: NEXT_PUBLIC_EMENU_URL
        value: https://talaltechno-emenu.onrender.com

  # ---------------------------------------------------------------------------
  # القائمة الإلكترونية (Next.js PWA) — تُخدم من جذر نطاقها
  # ---------------------------------------------------------------------------
  - type: web
    name: talaltechno-emenu
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: apps/emenu/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://talaltechno-api.onrender.com
      # على Render لا يوجد reverse proxy تحت /menu، لذلك تُخدم القائمة من الجذر
      # (القيم الافتراضية في apps/emenu/Dockerfile أصبحت فارغة).
