databases:
  - name: talaltechno-db
    databaseName: talaltechno
    user: talal
    plan: starter
    region: singapore

redis:
  - name: talaltechno-redis
    plan: starter

services:
  - type: web
    name: talaltechno-api
    runtime: docker
    plan: starter
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: talaltechno-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: talaltechno-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_PEPPER
        generateValue: true
      - key: APP_URL
        value: https://talaltechno-api.onrender.com
      - key: RUN_DB_PUSH
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: PAYMENTS_MODE
        value: mock
      - key: DELIVERY_MODE
        value: mock
      - key: PRINTER_MODE
        value: mock
      - key: ZATCA_ENVIRONMENT
        value: sandbox

  - type: web
    name: talaltechno-admin
    runtime: docker
    plan: starter
    dockerfilePath: apps/admin/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://talaltechno-api.onrender.com

  - type: web
    name: talaltechno-emenu
    runtime: docker
    plan: starter
    dockerfilePath: apps/emenu/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://talaltechno-api.onrender.com
      - key: NEXT_PUBLIC_BASE_PATH
        value: /menu
      - key: NEXT_PUBLIC_ASSET_PREFIX
        value: /menu-assets
